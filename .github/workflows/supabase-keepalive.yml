# Keeps the SpotSet Supabase project (trflnwrusbbbihelovkh) out of the free-tier
# inactivity pause.
#
# Why this exists: Supabase pauses a Free-plan project after ~7 days of low activity.
# On 2026-08-30 SpotSet was flagged for pausing because the app is still on a parallel
# run and nobody is hitting the database. Activity is measured in REQUESTS, not rows —
# "a few user requests to the database each day over the previous week" is enough — so
# inserting dummy data would not have helped. One cheap read a day does.
#
# A paused project can be restored from the dashboard, but the app would be down until
# someone noticed. This is the cheaper insurance. The permanent fix is the Pro plan,
# which is never paused.
#
# ⚠️ GitHub disables scheduled workflows in a repository with no commits for 60 days.
# That would stop the pings silently, which is worse than no keep-alive at all, so the
# second job below commits a timestamp on the 1st of each month purely to reset that
# clock. Twelve trivial commits a year is the price of not having to remember.

name: Supabase keep-alive

on:
  schedule:
    # 06:17 UTC daily. Odd minute on purpose: GitHub sheds load on the hour, so jobs
    # scheduled at :00 are the ones that get delayed or dropped.
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing - the project will pause."
            exit 1
          fi

          # ---- 1. Is the project awake at all? -------------------------------
          # GoTrue's health endpoint is the one thing the anon key can always read
          # cleanly, so this is the unambiguous reachability signal.
          auth_code=$(curl -sS -o /tmp/auth -w '%{http_code}'             -H "apikey: ${SUPABASE_ANON_KEY}"             "${SUPABASE_URL}/auth/v1/health")
          echo "auth/v1/health -> ${auth_code}"
          if [ "${auth_code}" != "200" ]; then
            echo "::error::Project unreachable (${auth_code}):"; head -c 500 /tmp/auth; exit 1
          fi

          # ---- 2. Did Postgres actually do work? -----------------------------
          # anon deliberately has no SELECT grant on the app's tables - the app
          # authenticates users first - so this returns 401 / SQLSTATE 42501 and
          # ALWAYS will. That is still a real database query: PostgREST reached
          # Postgres and Postgres evaluated permissions. So 2xx and 42501 are both
          # healthy, and anything else is not.
          #   A 404 means 'tenants' was renamed or dropped.
          #   A 401 WITHOUT 42501 means the key itself was rejected.
          rest_code=$(curl -sS -o /tmp/rest -w '%{http_code}'             -H "apikey: ${SUPABASE_ANON_KEY}"             -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"             "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1")
          echo "rest/v1/tenants -> ${rest_code}"

          case "${rest_code}" in
            2*)
              echo "Keep-alive OK (anon can read tenants)."
              ;;
            401|403)
              if grep -q '42501' /tmp/rest; then
                echo "Keep-alive OK (permission denied by Postgres, which means Postgres ran the query)."
              else
                echo "::error::Key rejected, not a permission error - SUPABASE_ANON_KEY was probably rotated:"
                head -c 500 /tmp/rest; exit 1
              fi
              ;;
            *)
              echo "::error::Unexpected response ${rest_code} - 'tenants' may have been renamed or dropped:"
              head -c 500 /tmp/rest; exit 1
              ;;
          esac

  # Keeps GitHub itself from disabling the schedule above. Runs on the 1st of the month
  # only; every other day this is a no-op that costs a few seconds.
  keep-schedule-enabled:
    runs-on: ubuntu-latest
    needs: ping
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch the heartbeat file on the 1st
        run: |
          set -euo pipefail
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st — nothing to do."
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-heartbeat.txt
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-heartbeat.txt
          git diff --staged --quiet || git commit -m 'chore: keep-alive heartbeat (resets GitHub 60-day schedule disable)'
          git push
