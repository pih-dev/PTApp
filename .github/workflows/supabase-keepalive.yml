# Keeps the SpotSet Supabase project (trflnwrusbbbihelovkh) out of the free-tier
# inactivity pause.
#
# Why this exists: Supabase pauses a Free-plan project after ~7 days of low activity.
# On 2026-08-30 SpotSet was flagged for pausing because the app is still on a parallel
# run and nobody is hitting the database. Activity is measured in REQUESTS, not rows —
# "a few user requests to the database each day over the previous week" is enough — so
# inserting dummy data would not have helped.
#
# 🔴 2026-09-07: FLAGGED AGAIN after six daily green runs of the first version. That
#    version's "database" request was an anon read of `tenants` that Postgres REJECTED
#    (42501). A denied query evidently does not count as user activity — only a query
#    that returns rows-or-empty with a 2xx does. So the ping now SIGNS IN as a dedicated
#    keep-alive user (owns nothing, RLS returns `[]`) and reads `tenants` as that user:
#    a real GoTrue password grant + a real PostgREST query that Postgres answers. And it
#    runs three times a day rather than once — "a few requests each day" is the wording.
#    The user was created with the service_role key from the archived env file; its
#    password lives ONLY there and in the two repo secrets.
#
# A paused project can be restored from the dashboard, but the app would be down until
# someone noticed. This is the cheaper insurance. The permanent fix is the Pro plan,
# which is never paused.
#
# ⚠️ GitHub disables scheduled workflows in a repository with no commits for 60 days.
# That would stop the pings silently, which is worse than no keep-alive at all, so the
# second job below commits a timestamp on the 1st of each month purely to reset that
# clock. Twelve trivial commits a year is the price of not having to remember.

name: Supabase keep-alive

on:
  schedule:
    # Three times a day, odd minutes on purpose: GitHub sheds load on the hour, so
    # jobs scheduled at :00 are the ones that get delayed or dropped.
    - cron: '17 6,14,22 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the project
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          KEEPALIVE_EMAIL: ${{ secrets.KEEPALIVE_EMAIL }}
          KEEPALIVE_PASSWORD: ${{ secrets.KEEPALIVE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in SUPABASE_URL SUPABASE_ANON_KEY KEEPALIVE_EMAIL KEEPALIVE_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::secret ${v} is missing - the project will pause."; exit 1
            fi
          done

          # ---- 1. Is the project awake at all? -------------------------------
          # GoTrue's health endpoint is the one thing the anon key can always read
          # cleanly, so this is the unambiguous reachability signal. A paused
          # project withdraws its DNS, so this fails with a resolve error.
          auth_code=$(curl -sS -o /tmp/auth -w '%{http_code}'             -H "apikey: ${SUPABASE_ANON_KEY}"             "${SUPABASE_URL}/auth/v1/health")
          echo "auth/v1/health -> ${auth_code}"
          if [ "${auth_code}" != "200" ]; then
            echo "::error::Project unreachable (${auth_code}):"; head -c 500 /tmp/auth; exit 1
          fi

          # ---- 2. Sign in as the keep-alive user ------------------------------
          # A password grant is itself database work (GoTrue reads auth.users),
          # and it yields the JWT the next step needs. The user is provisioned,
          # confirmed, and a member of no tenant - it can see nothing.
          token=$(curl -sS -X POST             -H "apikey: ${SUPABASE_ANON_KEY}" -H "Content-Type: application/json"             "${SUPABASE_URL}/auth/v1/token?grant_type=password"             -d "{\"email\":\"${KEEPALIVE_EMAIL}\",\"password\":\"${KEEPALIVE_PASSWORD}\"}"             | python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token",""))')
          if [ -z "${token}" ]; then
            echo "::error::Sign-in failed - the keep-alive user was deleted or its password changed."; exit 1
          fi
          echo "auth/v1/token -> signed in"

          # ---- 3. A query Postgres ANSWERS --------------------------------------
          # RLS filters tenants to the caller's own path; this user has none, so
          # the honest answer is []. That is still a query PostgREST sent and
          # Postgres evaluated to completion - which is what the inactivity
          # scan counts. Three reads, spaced, so one run registers as more than
          # a single blip.
          for i in 1 2 3; do
            rest_code=$(curl -sS -o /tmp/rest -w '%{http_code}'               -H "apikey: ${SUPABASE_ANON_KEY}"               -H "Authorization: Bearer ${token}"               "${SUPABASE_URL}/rest/v1/tenants?select=id&limit=1")
            echo "rest/v1/tenants (signed in, ${i}/3) -> ${rest_code} $(head -c 80 /tmp/rest)"
            case "${rest_code}" in
              2*) ;;
              *)
                echo "::error::Signed-in read failed (${rest_code}) - RLS or the table changed:"
                head -c 500 /tmp/rest; exit 1 ;;
            esac
            sleep 5
          done
          echo "Keep-alive OK (three answered queries as ${KEEPALIVE_EMAIL})."

  # Keeps GitHub itself from disabling the schedule above. Runs on the 1st of the month
  # only; every other day this is a no-op that costs a few seconds.
  keep-schedule-enabled:
    runs-on: ubuntu-latest
    needs: ping
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch the heartbeat file on the 1st
        run: |
          set -euo pipefail
          if [ "$(date -u +%d)" != "01" ]; then
            echo "Not the 1st — nothing to do."
            exit 0
          fi
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/keepalive-heartbeat.txt
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive-heartbeat.txt
          git diff --staged --quiet || git commit -m 'chore: keep-alive heartbeat (resets GitHub 60-day schedule disable)'
          git push
