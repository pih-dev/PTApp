is loading a spine that is bending rather than a hip that is folding.",ar:"لمّا يلتفّ الحوض، الجهاز بيصير يحمّل ظهر عم ينثني بدل ورك عم ينطوي."},cue:{en:"Stop the descent at the depth where your back is still flat on the pad.",ar:"وقّف النزول عند العمق يلّي ظهرك لسا لاصق فيه بالمسند."}},lunge:{flaw:{en:"The front knee runs forward past the foot and the heel lifts off the floor.",ar:"ركبة الرجل القدّامية بتروح لقدّام أبعد من الإجر والكعب بيرتفع عن الأرض."},injury:{en:"With the heel up, the whole rep is balanced on the front of the knee instead of shared with the hip.",ar:"والكعب مرفوع، كل الحركة بتصير محمولة على قدّام الركبة بدل ما تتوزّع مع الورك."},cue:{en:"Keep the front heel down and the shin close to vertical.",ar:"خلّي كعب الإجر القدّامية عالأرض والساق قريبة من العمودي."}},hinge:{flaw:{en:"The lower back rounds as the bar passes the knee, so the spine changes shape under load instead of holding it.",ar:"أسفل الظهر بيتقوّس لبرّا وقت ما البار بيمرق عند الركبة، فالعمود الفقري بيغيّر شكلو تحت الوزن بدل ما يضلّ ثابت."},injury:{en:"When the back rounds, the work moves off the hips and onto the spine, and the load ends up carried by a back that is bending rather than by the muscles meant to be holding it still.",ar:"لمّا الظهر يتقوّس، الشغل بينتقل من الورك عالعمود الفقري، فالوزن بيحملو ظهر عم ينثني بدل العضلات يلّي المفروض تثبّتو."},cue:{en:"Set the back before the bar moves, and keep that shape all the way up.",ar:"ثبّت ظهرك قبل ما يتحرّك البار، وضلّ محافظ على نفس الوضعية لفوق."}},"hip-bridge":{flaw:{en:"The last part of the lift comes from arching the lower back rather than from squeezing the hips.",ar:"آخر جزء من الرفعة بيجي من تقوّس أسفل الظهر مش من عصر المؤخرة."},injury:{en:"Arching past the top takes the load off the glutes and stacks it into the lower back at the end of its range.",ar:"التقوّس بعد آخر نقطة بيشيل الوزن عن المؤخرة وبيكدّسو بأسفل الظهر بآخر مداه."},cue:{en:"Finish with the ribs down and the hips squeezed, not with the back arched.",ar:"خلّص والقفص الصدري نازل والمؤخرة معصورة، مش والظهر متقوّس."}},"knee-extension":{flaw:{en:"The knee is snapped hard into full lockout at the top of every rep.",ar:"الركبة بتنقفل بقوّة لآخرها بأعلى نقطة بكل عدّة."},injury:{en:"Snapping into lockout hands the load from the quadriceps to a joint sitting at the very end of its range.",ar:"القفل بقوّة بينقل الوزن من عضلة الفخذ لمفصل واصل لآخر مداه."},cue:{en:"Stop just short of straight and hold the top for a beat.",ar:"وقّف قبل ما تفرد إجرك كلياً وثبّت لحظة بالأعلى."}},"knee-flexion":{flaw:{en:"The hips lift off the pad so the whole body helps the heel come up.",ar:"الورك بيرتفع عن المسند حتى كل الجسم يساعد الكعب يطلع."},injury:{en:"Once the hips lift, the hamstring stops being the thing shortening and the lower back takes the difference.",ar:"لمّا يرتفع الورك، عضلة الهامسترينغ بتبطّل هي يلّي عم تشتغل وأسفل الظهر بياخد الفرق."},cue:{en:"Keep the hips pinned to the pad and move only the lower leg.",ar:"خلّي وركك ثابت عالمسند وحرّك بس أسفل الإجر."}},"calf-raise":{flaw:{en:"The rep is bounced through a short range with the knee bending to help.",ar:"العدّة بتنطّ بمدى قصير والركبة بتنثني حتى تساعد."},injury:{en:"A bounced, bent-knee rep loads the ankle on the way down instead of the calf on the way up.",ar:"العدّة النطّيطة والركبة منثنية بتحمّل الكاحل وقت النزول بدل السمانة وقت الطلوع."},cue:{en:"Straight knee, all the way up, and control the way down.",ar:"ركبة مفرودة، اطلع لآخرك، وتحكّم بالنزول."}},"hip-abduction":{flaw:{en:"The trunk leans away so the body throws the leg out instead of the hip lifting it.",ar:"الجسم بيميل لجهة تانية حتى يرمي الإجر لبرّا بدل ما الورك يرفعها."},injury:{en:"Leaning turns a hip exercise into a side-bend, and the lower back does the range the hip did not.",ar:"الميلان بيحوّل تمرين الورك لانحناء جانبي، وأسفل الظهر بياخد المدى يلّي ما أخدو الورك."},cue:{en:"Keep the trunk still and take the leg only as far as the hip can send it.",ar:"ثبّت جسمك وودّي الإجر بس لحدّ ما بيقدر الورك يوصّلها."}},"hip-adduction":{flaw:{en:"The trunk leans into the movement instead of the inner thigh doing the work.",ar:"الجسم بيميل مع الحركة بدل ما يشتغل داخل الفخذ."},injury:{en:"Leaning across shortens the range the adductors actually work through and hands the rest to the lower back.",ar:"الميلان بيقصّر المدى يلّي بتشتغل فيه عضلات داخل الفخذ وبيعطي الباقي لأسفل الظهر."},cue:{en:"Sit tall and bring the leg in without following it with your body.",ar:"اقعد مستقيم وقرّب إجرك بدون ما يتبعها جسمك."}},"back-extension":{flaw:{en:"The rep is driven past straight into an arch at the top.",ar:"العدّة بتكمّل بعد الاستقامة لتقوّس بأعلى نقطة."},injury:{en:"Past straight there is no muscle range left, so the top of the movement is held by the joints of the lower back.",ar:"بعد الاستقامة ما بيضلّ مدى للعضلة، فأعلى الحركة بتمسكو مفاصل أسفل الظهر."},cue:{en:"Stop when your body is a straight line — that is the top of the rep.",ar:"وقّف لمّا يصير جسمك خط مستقيم — هيدي آخر العدّة."}},"hip-extension":{flaw:{en:"The leg only goes higher because the lower back has arched to send it.",ar:"الإجر بتطلع أعلى بس لأنّ أسفل الظهر تقوّس حتى يبعتها."},injury:{en:"The extra height is coming from the spine, not the hip, so the glute stops working exactly where you wanted it to.",ar:"الارتفاع الزيادة جايي من العمود الفقري مش من الورك، فالمؤخرة بتبطّل تشتغل بالضبط وين بدّك ياها."},cue:{en:"Keep the ribs down and stop when the hip runs out of range.",ar:"خلّي القفص الصدري نازل ووقّف لمّا يخلص مدى الورك."}},"leg-press":{flaw:{en:"The knees are snapped hard into full lockout at the top of every rep.",ar:"الركبة بتنقفل بقوّة لآخرها بأعلى نقطة بكل عدّة."},injury:{en:"Snapping into lockout hands the load from the quadriceps to a joint sitting at the very end of its range, so the muscle stops absorbing the sled and the leg takes the stop instead.",ar:"لمّا تقفل ركبتك بقوّة، الوزن بينتقل من عضلة الفخذ لمفصل واصل لآخر مداه، فالعضلة بتبطّل تمتصّ الوزن وبتصير الإجر هي يلّي بتوقّفو."},cue:{en:"Stop just short of straight and keep the tension on the quads.",ar:"وقّف قبل ما تفرد إجرك كلياً وخلّي الشدّ على عضلة الفخذ."}},"bench-press":{flaw:{en:"The arch is pushed past control and the hips come off the bench, so the lower back holds the position instead of the upper back and the legs.",ar:"التقوّس لفوق بيزيد عن حدّو والورك بيطلع عن البنش، فأسفل الظهر بيصير هو يلّي ماسك الوضعية بدل أعلى الظهر والرجلين."},injury:{en:"With the hips off the bench the lower back is holding an arched position on its own while a loaded bar sits over the chest, and the base the press is supposed to push against is gone.",ar:"والورك مرفوع عن البنش، أسفل الظهر بيصير ماسك التقوّس لحالو والبار محمّل فوق الصدر، وبتروح القاعدة يلّي المفروض تدفع منها."},cue:{en:"Keep the glutes on the bench and lift the chest with the upper back, not the lower.",ar:"خلّي مؤخرتك على البنش وارفع صدرك من أعلى ظهرك، مش من أسفلو."},extra:{en:"The elbows have flared out square to the body. Bring them to about 45° from the ribs — square elbows put the shoulder at its widest angle exactly when the bar is heaviest.",ar:"الكوعين مفتوحين عمودي على الجسم. رجّعهن لحدود ٤٥ درجة عن جنبك — الكوع المفتوح بيحطّ الكتف بأوسع زاوية بالضبط لمّا يكون البار أتقل شي."}},"chest-press":{flaw:{en:"The elbows ride up above the line of the shoulders at the bottom of the press.",ar:"الكوعين بيطلعوا فوق خط الكتف وقت بترجع الوزن لآخر نقطة."},injury:{en:"With the elbow above the shoulder, the joint is near the end of its range at the moment the load is heaviest, and the front of the shoulder is what takes it.",ar:"لمّا الكوع يكون أعلى من الكتف، المفصل بيكون قريب من آخر مداه بنفس اللحظة يلّي الوزن فيها أتقل شي، وقدّام الكتف هو يلّي بيتحمّلو."},cue:{en:"Keep the elbows just below shoulder height through the whole rep.",ar:"خلّي كوعك شوي تحت خط الكتف طول الحركة."}},"push-up":{flaw:{en:"The hips drop and the body sags between the shoulders and the feet.",ar:"الورك بينزل والجسم بيهبط بين الكتفين والإجرين."},injury:{en:"A sagging middle means the trunk has stopped holding the line, so the lower back is carrying the body instead of the abs.",ar:"هبوط الوسط معناتو الجذع بطّل ماسك الخط، فأسفل الظهر عم يحمل الجسم بدل عضلات البطن."},cue:{en:"Squeeze the glutes and the abs so you move as one piece.",ar:"اعصر مؤخرتك وبطنك حتى تتحرّك قطعة وحدة."}},dip:{flaw:{en:"The rep is dropped too deep and the shoulder finishes below the elbow.",ar:"النزلة بتصير عميقة كتير والكتف بيخلص أوطى من الكوع."},injury:{en:"Below the elbow the shoulder is at the far end of its range carrying your whole bodyweight, and the front of the joint is where that lands.",ar:"تحت الكوع، الكتف بيكون بآخر مداه وحامل كل وزن جسمك، وقدّام المفصل هو يلّي بياخد هالشدّ."},cue:{en:"Stop when the upper arm is level with the floor.",ar:"وقّف لمّا يصير أعلى الذراع موازي للأرض."}},fly:{flaw:{en:"The arms open too far with the elbows locked straight.",ar:"الإيدين بيفتحوا كتير والكوع مفرود لآخرو."},injury:{en:"A straight arm makes the weight leverage longest exactly where the shoulder has least range left.",ar:"الإيد المفرودة بتخلّي ذراع الوزن أطول شي بالضبط وين الكتف ما ضلّ عندو مدى."},cue:{en:"Keep a soft bend in the elbows and stop when you feel the chest, not the joint.",ar:"خلّي كوعك منثني شوي ووقّف لمّا تحسّ بالصدر، مش بالمفصل."}},"overhead-press":{flaw:{en:"The lifter leans back under the bar and presses with the lower back.",ar:"الشخص بيرجع لورا تحت البار وبيدفع من أسفل الظهر."},injury:{en:"Leaning back turns a vertical press into an incline press, and the arch holding you there is the lower back at the end of its range.",ar:"الرجوع لورا بيحوّل الدفع العمودي لدفع مايل، والتقوّس يلّي ماسكك هو أسفل الظهر بآخر مداه."},cue:{en:"Squeeze the glutes, keep the ribs down, and press straight up past your face.",ar:"اعصر مؤخرتك، خلّي القفص الصدري نازل، وادفع مستقيم لفوق حدا وجهك."}},"triceps-pushdown":{flaw:{en:"The elbows travel forward and the body leans into the weight.",ar:"الكوعين بيروحوا لقدّام والجسم بيميل على الوزن."},injury:{en:"Once the elbow moves, the shoulder and the trunk are doing the rep and the triceps are along for the ride.",ar:"لمّا يتحرّك الكوع، الكتف والجذع بيصيروا هنّي يعملوا العدّة والترايسبس بس ماشي معهن."},cue:{en:"Pin the elbows at your sides and move only the forearms.",ar:"ثبّت كوعك على جنبك وحرّك بس السواعد."}},"triceps-overhead":{flaw:{en:"The ribs flare and the lower back arches to get the elbows overhead.",ar:"القفص الصدري بيفتح وأسفل الظهر بيتقوّس حتى يطلّع الكوعين فوق الراس."},injury:{en:"The range the shoulder cannot give is taken out of the lower back instead.",ar:"المدى يلّي ما بيقدر يعطيه الكتف بينشدّ من أسفل الظهر بدلو."},cue:{en:"Brace the middle and only take the elbows as far back as the ribs allow.",ar:"شدّ وسطك ورجّع كوعك بس لحدّ ما بيسمح القفص الصدري."}},shrug:{flaw:{en:"The elbows bend and the shrug turns into a half-row.",ar:"الكوعين بينثنوا والهزّة بتصير نص تجديف."},injury:{en:"Bending the elbow means the arms are lifting the weight, so the traps never get the range the movement exists for.",ar:"ثني الكوع معناتو الإيدين عم يرفعوا الوزن، فالترابيس عمرها ما بتاخد المدى يلّي انعمل التمرين لأجلو."},cue:{en:"Straight arms, shoulders straight up, and let them all the way back down.",ar:"إيدين مفرودين، الكتفين لفوق مستقيم، وخلّيهن ينزلوا لآخرهن."}},"external-rotation":{flaw:{en:"The elbow drifts off the ribs and the shoulder swings instead of rotating.",ar:"الكوع بيبعد عن جنب الجسم والكتف بيتأرجح بدل ما يلفّ."},injury:{en:"With the elbow away from the body the small muscles this drill trains stop being the ones working.",ar:"والكوع بعيد عن الجسم، العضلات الصغيرة يلّي بيدرّبها هالتمرين بتبطّل هي يلّي عم تشتغل."},cue:{en:"Keep a towel between elbow and ribs and rotate only the forearm.",ar:"خلّي فوطة بين الكوع وجنبك ولفّ بس الساعد."}},"front-raise":{flaw:{en:"The weight is swung up with a backward lean instead of lifted.",ar:"الوزن بينرمى لفوق مع رجوع لورا بدل ما ينرفع."},injury:{en:"The swing means the shoulder never has to produce the range, and the lower back absorbs the stop at the top.",ar:"المرجحة معناتها الكتف ما بيضطر يعمل المدى، وأسفل الظهر بيمتصّ الوقفة بالأعلى."},cue:{en:"Stand still and raise to shoulder height under control.",ar:"وقّف ثابت وارفع لخط الكتف بتحكّم."}},"lateral-raise":{flaw:{en:"The arms go well above shoulder height and the shoulders ride up with them.",ar:"الإيدين بيطلعوا كتير فوق خط الكتف والكتفين بيطلعوا معهن."},injury:{en:"Above the shoulder line the side of the shoulder has nothing left to give, so the joint finishes the range instead of the muscle.",ar:"فوق خط الكتف، جنب الكتف ما بيضلّ عندو شي يعطيه، فالمفصل بيكمّل المدى بدل العضلة."},cue:{en:"Stop at shoulder height and keep the shoulders down away from your ears.",ar:"وقّف عند خط الكتف وخلّي كتفيك نازلين بعيد عن ودانك."}},"vertical-pull":{flaw:{en:"The elbows flare wide and the body swings, so the pull is thrown rather than driven from the back.",ar:"الكوعين بيفتحوا لبرّا والجسم بيتمرجح، فبتصير ترمي حالك بدل ما تسحب من ظهرك."},injury:{en:"A wide, swung pull loads the front of the shoulder at the end of its range, at the point in the rep where the back muscles have stopped doing the holding.",ar:"السحب العريض مع المرجحة بيحمّل قدّام الكتف بآخر مداه، بنفس اللحظة يلّي عضلات الظهر بتكون وقّفت تمسك فيها."},cue:{en:"Keep the elbows under the hands and pull the chest to the bar without swinging.",ar:"خلّي كوعك تحت إيدك واسحب صدرك للبار بدون ما تتمرجح."}},row:{flaw:{en:"The back rounds and the rep is jerked upward with the whole trunk.",ar:"الظهر بيتقوّس والعدّة بتنشدّ لفوق بكل الجذع."},injury:{en:"Jerking from a rounded position means the spine is moving under the load instead of holding still while the arms pull.",ar:"الشدّ من وضعية متقوّسة معناتو العمود الفقري عم يتحرّك تحت الوزن بدل ما يضلّ ثابت والإيدين تسحب."},cue:{en:"Set the back, then pull to the ribs with the elbows, not with the trunk.",ar:"ثبّت ظهرك، وبعدين اسحب لعند الأضلاع بالكوعين، مش بالجذع."}},"upright-row":{flaw:{en:"The bar is pulled all the way up to the collarbone with the elbows above the shoulders.",ar:"البار بينسحب لفوق لحدّ الترقوة و خذك وحرّك بس إيدك."}},carry:{flaw:{en:"The body leans away from the load instead of bracing against it.",ar:"الجسم بيميل بعيد عن الوزن بدل ما يشدّ ضدّو."},injury:{en:"Leaning hands the job to the lower back on one side, which is the exact thing a loaded carry is meant to train you not to do.",ar:"الميلان بيعطي الشغلة لأسفل الظهر من جهة وحدة، وهيدا بالضبط الشي يلّي المشي بالوزن بيدرّبك ما تعملو."},cue:{en:"Stand tall, ribs down, and walk without tipping.",ar:"وقّف مستقيم، القفص الصدري نازل، وامشي بدون ما تميل."}},plank:{flaw:{en:"The hips drop and the middle sags toward the floor.",ar:"الورك بينزل والوسط بيهبط عالأرض."},injury:{en:"A sagging plank is no longer held by the abs — the lower back is holding the body up at the end of its range.",ar:"البلانك الهابط ما عاد ماسكو عضلات البطن — أسفل الظهر هو يلّي ماسك الجسم بآخر مداه."},cue:{en:"Squeeze the glutes and tuck the ribs so you make one straight line.",ar:"اعصر مؤخرتك واسحب أضلاعك لتحت حتى تصير خط مستقيم."}},"side-plank":{flaw:{en:"The bottom hip sinks toward the floor.",ar:"الورك السفلي بيغوص عالأرض."},injury:{en:"Once the hip drops, the side of the trunk has stopped holding and the weight rests on the shoulder and the lower back.",ar:"لمّا ينزل الورك، جنب الجذع بيبطّل ماسك والوزن بيرتاح عالكتف وأسفل الظهر."},cue:{en:"Push the floor away and lift the bottom hip until you are one line.",ar:"ادفع الأرض وارفع الورك السفلي لحدّ ما تصير خط واحد."}},"reverse-plank":{flaw:{en:"The hips sink and the shoulders take the whole load.",ar:"الورك بيغوص والكتفين بياخدوا كل الوزن."},injury:{en:"With the hips down the glutes are doing nothing, and the position is being held at the front of the shoulders.",ar:"والورك نازل، المؤخرة ما عم تعمل شي، والوضعية عم تنمسك من قدّام الكتفين."},cue:{en:"Drive the hips up until your body is a straight line, and keep them there.",ar:"ادفع وركك لفوق لحدّ ما يصير جسمك خط مستقيم، وخلّيه هيك."}},crunch:{flaw:{en:"The head is pulled forward with the hands and the trunk is hauled up by the hips.",ar:"
