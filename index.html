itting at the very end of its range.",ar:"القفل بقوّة بينقل الوزن من عضلة الفخذ لمفصل واصل لآخر مداه."},cue:{en:"Stop just short of straight and hold the top for a beat.",ar:"وقّف قبل ما تفرد إجرك كلياً وثبّت لحظة بالأعلى."}},"knee-flexion":{flaw:{en:"The hips lift off the pad so the whole body helps the heel come up.",ar:"الورك بيرتفع عن المسند حتى كل الجسم يساعد الكعب يطلع."},injury:{en:"Once the hips lift, the hamstring stops being the thing shortening and the lower back takes the difference.",ar:"لمّا يرتفع الورك، عضلة الهامسترينغ بتبطّل هي يلّي عم تشتغل وأسفل الظهر بياخد الفرق."},cue:{en:"Keep the hips pinned to the pad and move only the lower leg.",ar:"خلّي وركك ثابت عالمسند وحرّك بس أسفل الإجر."}},"calf-raise":{flaw:{en:"The rep is bounced through a short range with the knee bending to help.",ar:"العدّة بتنطّ بمدى قصير والركبة بتنثني حتى تساعد."},injury:{en:"A bounced, bent-knee rep loads the ankle on the way down instead of the calf on the way up.",ar:"العدّة النطّيطة والركبة منثنية بتحمّل الكاحل وقت النزول بدل السمانة وقت الطلوع."},cue:{en:"Straight knee, all the way up, and control the way down.",ar:"ركبة مفرودة، اطلع لآخرك، وتحكّم بالنزول."}},"hip-abduction":{flaw:{en:"The trunk leans away so the body throws the leg out instead of the hip lifting it.",ar:"الجسم بيميل لجهة تانية حتى يرمي الإجر لبرّا بدل ما الورك يرفعها."},injury:{en:"Leaning turns a hip exercise into a side-bend, and the lower back does the range the hip did not.",ar:"الميلان بيحوّل تمرين الورك لانحناء جانبي، وأسفل الظهر بياخد المدى يلّي ما أخدو الورك."},cue:{en:"Keep the trunk still and take the leg only as far as the hip can send it.",ar:"ثبّت جسمك وودّي الإجر بس لحدّ ما بيقدر الورك يوصّلها."}},"hip-adduction":{flaw:{en:"The trunk leans into the movement instead of the inner thigh doing the work.",ar:"الجسم بيميل مع الحركة بدل ما يشتغل داخل الفخذ."},injury:{en:"Leaning across shortens the range the adductors actually work through and hands the rest to the lower back.",ar:"الميلان بيقصّر hen the elbows reach shoulder height, and go a little wider on the grip.",ar:"وقّف لمّا يوصلوا الكوعين لخط الكتف، ووسّع مسكتك شوي."}},pullover:{flaw:{en:"The ribs flare and the back lifts off the bench to reach further behind.",ar:"القفص الصدري بيفتح والظهر بيرتفع عن البنش حتى توصل أبعد لورا."},injury:{en:"The extra reach is coming from the lower back opening up, not from the shoulder, and the weight is directly overhead when it happens.",ar:"الوصول الزيادة جايي من انفتاح أسفل الظهر مش من الكتف، والوزن بيكون فوق الراس مباشرة وقتها."},cue:{en:"Keep the ribs down and stop where the shoulders stop.",ar:"خلّي القفص الصدري نازل ووقّف وين بيوقفوا الكتفين."}},curl:{flaw:{en:"The lower back arches and the body swings back to throw the bar up, with the elbows drifting forward off the ribs.",ar:"أسفل الظهر بيتقوّس لورا والجسم بيرجع لورا حتى يرمي البار لفوق، والكوعين بيروحوا لقدّام وبيبعدوا عن جنبك."},injury:{en:"Heaving the bar moves the work off the biceps and onto the lower back, which ends up swinging a load it is not in a position to hold.",ar:"رمي البار بينقل الشغل من عضلة البايسبس لأسفل الظهر، فبيصير يرجّح وزن مش موجود بوضعية تمسكو."},cue:{en:"Pin the elbows to your ribs and let only the forearms move.",ar:"ثبّت كوعك على جنبك وخلّي الساعد بس هو يلّي يتحرّك."}},"wrist-curl":{flaw:{en:"The whole arm moves, so the wrist never travels through its own range.",ar:"كل الإيد عم تتحرّك، فالمعصم عمرو ما بياخد مداه."},injury:{en:"If the forearm is moving, the wrist is being carried rather than worked, and the elbow takes the load instead.",ar:"إذا الساعد عم يتحرّك، المعصم عم ينحمل مش عم يشتغل، والكوع بياخد الوزن بدلو."},cue:{en:"Rest the forearm on your thigh and move only the hand.",ar:"حطّ ساعدك على فخذك وحرّك بس إيدك."}},carry:{flaw:{en:"The body leans away from the load instead of bracing against it.",ar:"الجسم بيميل بعيد عن الوزن بدل ما يشدّ ضدّو."},injury:{en:"Leaning hands the job to the lower back on one side, which is the exact thing a loaded carry is meant to train you not to do.",ar:"الميلان بيعطي الشغلة لأسفل الظهر من جهة وحدة، وهيدا بالضبط الشي يلّي المشي بالوزن بيدرّبك ما تعملو."},cue:{en:"Stand tall, ribs down, and walk without tipping.",ar:"وقّف مستقيم، القفص الصدري نازل، وامشي بدون ما تميل."}},plank:{flaw:{en:"The hips drop and the middle sags toward the floor.",ar:"الورك بينزل والوسط بيهبط عالأرض."},injury:{en:"A sagging plank is no longer held by the abs — the lower back is holding the body up at the end of its range.",ar:"البلانك الهابط ما عاد ماسكو عضلات البطن — أسفل الظهر هو يلّي ماسك الجسم بآخر مداه."},cue:{en:"Squeeze the glutes and tuck the ribs so you make one straight line.",ar:"اعصر مؤخرتك واسحب أضلاعك لتحت حتى تصير خط مستقيم."}},"side-plank":{flaw:{en:"The bottom hip sinks toward the floor.",ar:"الورك السفلي بيغوص عالأرض."},injury:{en:"Once the hip drops, the side of the trunk has stopped holding and the weight rests on the shoulder and the lower back.",ar:"لمّا ينزل الورك، جنب الجذع بيبطّل ماسك والوزن بيرتاح عالكتف وأسفل الظهر."},cue:{en:"Push the floor away and lift the bottom hip until you are one line.",ar:"ادفع الأرض وارفع الورك السفلي لحدّ ما تصير خط واحد."}},"reverse-plank":{flaw:{en:"The hips sink and the shoulders take the whole load.",ar:"الورك بيغوص والكتفين بياخدوا كل الوزن."},injury:{en:"With the hips down the glutes are doing nothing, and the position is being held at the front of the shoulders.",ar:"والورك نازل، المؤخرة ما عم تعمل شي، والوضعية عم تنمسك من قدّام الكتفين."},cue:{en:"Drive the hips up until your body is a straight line, and keep them there.",ar:"ادفع وركك لفوق لحدّ ما يصير جسمك خط مستقيم، وخلّيه هيك."}},crunch:{flaw:{en:"The head is pulled forward with the hands and the trunk is hauled up by the hips.",ar:"الراس بينسحب لقدّام بالإيدين والجذع بينشدّ لفوق من الورك."},injury:{en:"Pulling on the head moves the range into the neck, and hauling from the hips means the abs never shortened at all.",ar:"شدّ الراس بينقل المدى للرقبة، والشدّ من الورك معناتو عضلات البطن عمرها ما قصّرت."},cue:{en:
